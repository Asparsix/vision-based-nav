/**:
  ros__parameters:
    use_sim_time: true

    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true
    publish_acceleration: false
    print_diagnostics: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # ---- Wheel odometry (Gazebo DiffDrive) ----
    odom0: wheel/odom
    odom0_config: [true,  true,  false,
                   false, false, true,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    # ---- RGB-D visual odometry (rtabmap rgbd_odometry) ----
    odom1: vo/odom
    odom1_config: [true,  true,  false,
                   false, false, true,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom1_differential: false
    odom1_relative: false
    odom1_queue_size: 5
    # Soft: VO can jump when features are lost
    odom1_pose_rejection_threshold: 10.0
    odom1_twist_rejection_threshold: 10.0

    # ---- IMU ----
    imu0: imu
    # Yaw orientation + yaw rate (+ planar accel); gravity removed
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  true,  true,  false]
    imu0_differential: false
    imu0_relative: true
    imu0_queue_size: 20
    imu0_remove_gravitational_acceleration: true

    # Mild process noise (diagonal) for planar UGV
